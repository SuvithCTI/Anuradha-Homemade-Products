<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Anuradha Homemade Organics</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="brand-name">Anuradha Homemade Organics</h1>
            <p class="brand-tagline">Pure. Natural. Sustainable.</p>
        </div>

        <div class="auth-card">
            <h2 class="auth-title">Reset Your Password</h2>
            
            <!-- Success/Error Messages -->
            <div id="alert-box" class="alert">
                <span id="alert-text"></span>
            </div>

            <!-- Token missing warning state -->
            <div id="invalid-token-state" style="display: none; text-align: center; color: var(--error-color);">
                <p>Invalid or missing password reset token.</p>
                <p style="margin-top: 15px;"><a href="forgot-password.html" class="forgot-link">Request a new reset link</a></p>
            </div>

            <form id="reset-form" novalidate style="display: none;">
                <input type="hidden" id="token">

                <!-- New Password -->
                <div class="form-group">
                    <label for="password" class="form-label">New Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Min. 8 characters" required>
                        <button type="button" id="toggle-password" class="password-toggle" tabindex="-1" aria-label="Toggle password visibility">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <!-- Password Strength Meter -->
                    <div class="strength-meter" id="strength-meter">
                        <div class="strength-bar" id="strength-bar"></div>
                    </div>
                    <div class="strength-text" id="strength-text">Password strength</div>
                    <div id="password-error" class="validation-msg">Password must be at least 8 characters long.</div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat new password" required>
                        <button type="button" id="toggle-confirm-password" class="password-toggle" tabindex="-1" aria-label="Toggle confirm password visibility">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div id="confirm-error" class="validation-msg">Passwords do not match.</div>
                </div>

                <!-- Reset Password Button -->
                <button type="submit" id="btn-reset" class="btn btn-primary">
                    <span class="btn-text">Reset Password</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="auth-footer">
                Back to <a href="index.html">Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/reset-password.js"></script>
</body>
</html>

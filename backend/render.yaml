services:
  - type: web
    name: anuradha-backend
    runtime: java
    region: singapore
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/organics-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: anuradha_organics
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://anuradha-homemade-products.vercel.app
      - key: BACKEND_URL
        sync: false
      - key: JAVA_VERSION
        value: 17

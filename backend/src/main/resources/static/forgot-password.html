<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Anuradha Homemade Organics</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="brand-name">Anuradha Homemade Organics</h1>
            <p class="brand-tagline">100% Organic, 100% Pure.</p>
        </div>

        <div class="auth-card">
            <h2 class="auth-title">Reset Password</h2>
            <p style="text-align: center; color: var(--text-light); font-size: 13px; margin-bottom: 25px;">
                Enter your email address below, and if an account exists, we will send you a link to reset your password.
            </p>
            
            <!-- Success/Error Messages -->
            <div id="alert-box" class="alert">
                <span id="alert-text"></span>
            </div>

            <form id="forgot-form" novalidate>
                <!-- Email -->
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-input" placeholder="e.g., customer@example.com" required>
                    </div>
                    <div id="email-error" class="validation-msg">Please enter a valid email address.</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btn-forgot" class="btn btn-primary">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <!-- Back to Login Link -->
            <div class="auth-footer">
                Remember your password? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/forgot-password.js"></script>
</body>
</html>

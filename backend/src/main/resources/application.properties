spring.application.name=organics

# Database Configuration (Embedded H2 Database - Runs automatically inside Render, no external database needed)
spring.datasource.url=jdbc:h2:file:./data/anuradha_organics;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# SMTP / Email Configuration (Port 587 STARTTLS with 5s timeout safeguard)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:suvithsuvi22@gmail.com}
spring.mail.password=${SMTP_PASSWORD:fckfltzkvsaikrzo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Google OAuth 2.0 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# Custom Application Configuration
app.jwt.secret=${JWT_SECRET:anuradha_homemade_organics_super_secret_key_1234567890_which_is_sufficiently_long_and_secure}
# JWT expires in 24 hours (86,400,000 ms)
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=token
app.frontend.url=${FRONTEND_URL:https://anuradha-homemade-products.vercel.app}
app.backend.url=${BACKEND_URL:https://anuradha-homemade-products.onrender.com}

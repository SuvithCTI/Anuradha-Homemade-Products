spring.application.name=organics

# Database Configuration (Embedded H2 Database - No external setup required)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/anuradha_organics;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# SMTP / Email Configuration (SSL / Port 465)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:suvithsuvi22@gmail.com}
spring.mail.password=${SMTP_PASSWORD:ughiejuyqcxmilxl}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# Google OAuth 2.0 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# Custom Application Configuration
app.jwt.secret=${JWT_SECRET:anuradha_homemade_organics_super_secret_key_1234567890_which_is_sufficiently_long_and_secure}
# JWT expires in 24 hours (86,400,000 ms)
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=token
app.frontend.url=${FRONTEND_URL:http://localhost:8080}
app.backend.url=${BACKEND_URL:http://localhost:8080}

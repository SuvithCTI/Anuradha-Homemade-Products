spring.application.name=organics

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:anuradha_organics}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# SMTP / Email Configuration (SSL / Port 465)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:suvithsuvi22@gmail.com}
spring.mail.password=${SMTP_PASSWORD:ughiejuyqcxmilxl}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# Google OAuth 2.0 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# Custom Application Configuration
app.jwt.secret=${JWT_SECRET:anuradha_homemade_organics_super_secret_key_1234567890_which_is_sufficiently_long_and_secure}
# JWT expires in 24 hours (86,400,000 ms)
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=token
app.frontend.url=${FRONTEND_URL:http://localhost:8080}
app.backend.url=${BACKEND_URL:http://localhost:8080}

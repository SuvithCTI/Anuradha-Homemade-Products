spring.application.name=organics

# Database Configuration (Embedded H2 Database - Runs automatically inside Render, no external database needed)
spring.datasource.url=jdbc:h2:file:./data/anuradha_organics;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# SMTP / Email Configuration (Port 587 STARTTLS)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:suvithsuvi22@gmail.com}
spring.mail.password=${SMTP_PASSWORD:fckfltzkvsaikrzo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Resend HTTPS API Key (Cloud Email Delivery)
resend.api.key=${RESEND_API_KEY:}

# Google OAuth 2.0 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# Custom Application Configuration
app.jwt.secret=${JWT_SECRET:anuradha_homemade_organics_super_secret_key_1234567890_which_is_sufficiently_long_and_secure}
# JWT expires in 24 hours (86,400,000 ms)
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=token
app.frontend.url=${FRONTEND_URL:http://localhost:8080}
app.backend.url=${BACKEND_URL:http://localhost:8080}

# File Upload & Request Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.enabled=true
